name: run-mexc-bot-daily

on:
  schedule:
    - cron: "45 10 * * *"   # 11:45 Lagos (UTC+1)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run bot
        env:
          MEXC_KEY: ${{ secrets.MEXC_KEY }}
          MEXC_SECRET: ${{ secrets.MEXC_SECRET }}

          # Screener settings
          HISTORY_DAYS: "30"
          MIN_DAYS_OLD: "3"
          VOL_MIN: "10000000"
          VOL_MAX: "600000000"
          TARGET_PCT: "50"
          ANCHOR_HOUR: "17"
          TOP_N: "20"

          # Trading settings (optional)
          DO_BUY: "1"              # 1 = trade, 0 = scan only
          BUY_RANKS: "1,2"
          BUY_TIME: "11:59:59"     # Lagos time
          BUY_PCT_BALANCE: "50"
          TP_PCT: "50"

        run: |
          python bot.py
